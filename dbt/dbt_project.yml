name: sdis_shopverse
version: "1.0.0"
config-version: 2
profile: sdis

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  raw_database: SDIS_DB
  raw_schema: RAW
  drift_schema: DRIFT
  # Used only by the semantic-drift remediation (INR per USD). Confirmed by the producer before use.
  fx_inr_per_usd: 84

models:
  sdis_shopverse:
    +persist_docs: {relation: true, columns: true}
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

flags:
  require_explicit_package_overrides_for_builtin_materializations: true
