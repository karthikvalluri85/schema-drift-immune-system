[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sdis"
version = "0.1.0"
description = "Schema Drift Immune System — deterministic schema-drift detection, routing and remediation for dbt + Snowflake, run as a Paperclip company"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Karthik Valluri"}]
dependencies = [
  "pyyaml>=6",
  "requests>=2.31",
  "snowflake-connector-python>=3.12",
  "cryptography>=42",
  "dbt-core>=1.10",
  "dbt-snowflake>=1.10",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dashboard = ["streamlit>=1.40", "pandas>=2.2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pre-commit>=3.7"]

[project.scripts]
sdis = "sdis.cli:main"

[tool.setuptools.packages.find]
include = ["sdis*"]

[tool.setuptools.package-data]
sdis = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*RequestsDependencyWarning.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "S608", "E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B603", "B607", "B608"]
