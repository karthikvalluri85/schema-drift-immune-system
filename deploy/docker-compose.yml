# Local laptop stack for the SDIS API and dashboard:
#   cp .env.example .env   (fill in what you have — everything is optional for demo mode)
#   docker compose -f deploy/docker-compose.yml up --build
#   API docs  → http://localhost:8000/docs
#   Dashboard → http://localhost:8501
# Paperclip runs separately:  npx paperclipai onboard --yes   → http://localhost:3100
services:
  api:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: [../.env]
    environment:
      SNOWFLAKE_PRIVATE_KEY_PATH: /keys/sdis_agent.p8
    volumes: ["../keys:/keys:ro"]
    ports: ["8000:8000"]
    restart: unless-stopped
  dashboard:
    build: {context: .., dockerfile: deploy/Dockerfile}
    env_file: [../.env]
    environment:
      SNOWFLAKE_PRIVATE_KEY_PATH: /keys/sdis_agent.p8
    volumes: ["../keys:/keys:ro"]
    command: ["streamlit", "run", "streamlit/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501",
              "--server.headless=true", "--browser.gatherUsageStats=false"]
    ports: ["8501:8501"]
    restart: unless-stopped
