# Alternative: DigitalOcean App Platform (PaaS, no server to manage) for the API + dashboard only.
# Paperclip needs a persistent disk, so keep it on a Droplet (or your laptop).
#   doctl apps create --spec deploy/digitalocean/app-platform.yaml
name: sdis
region: blr
services:
  - name: api
    github: {repo: karthikvalluri85/schema-drift-immune-system, branch: main, deploy_on_push: true}
    dockerfile_path: deploy/Dockerfile
    http_port: 8000
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check: {http_path: /health}
    envs:
      - {key: SNOWFLAKE_ACCOUNT, scope: RUN_TIME, type: SECRET}
      - {key: SDIS_API_TOKEN, scope: RUN_TIME, type: SECRET}
      - {key: GITHUB_WEBHOOK_SECRET, scope: RUN_TIME, type: SECRET}
      - {key: JIRA_WEBHOOK_SECRET, scope: RUN_TIME, type: SECRET}
  - name: dashboard
    github: {repo: karthikvalluri85/schema-drift-immune-system, branch: main, deploy_on_push: true}
    dockerfile_path: deploy/Dockerfile
    run_command: streamlit run streamlit/streamlit_app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    http_port: 8501
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
